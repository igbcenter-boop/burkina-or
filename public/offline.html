<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E0E10" />
    <title>Hors ligne · Burkina Or</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #0E0E10; color: #FAF7F0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
      main { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { margin: 6px 0 0; font-family: Georgia, serif; font-weight: 600; font-size: 34px; line-height: 1.1; }
      .gold { background: linear-gradient(135deg, #8C6A1F 0%, #D9BC6E 45%, #B8923A 70%, #8C6A1F 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      p { margin: 0; color: #C9C2B3; line-height: 1.6; font-size: 15px; }
      button { margin-top: 8px; height: 50px; padding: 0 24px; border: 0; border-radius: 8px; background: #B8923A; color: #0E0E10; font: 600 15px system-ui, sans-serif; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="Burkina Or" />
      <h1>Burkina <span class="gold">Or</span></h1>
      <p>Vous êtes hors ligne. Le cours de l'or, vos commandes et le paiement nécessitent une connexion : reconnectez-vous puis réessayez.</p>
      <button onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
